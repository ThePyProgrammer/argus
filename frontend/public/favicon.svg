  <rect x="16" y="4" width="32" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="26" cy="18" r="4" fill="#38bdf8"/>
  <circle cx="38" cy="18" r="4" fill="#38bdf8"/>
  <circle cx="26" cy="18" r="1.5" fill="#0f172a"/>
  <circle cx="38" cy="18" r="1.5" fill="#0f172a"/>
  <!-- Antenna -->
