  <!-- Chest panel -->
  <rect x="22" y="40" width="20" height="8" rx="2" fill="#0f172a"/>
  <circle cx="28" cy="44" r="2" fill="#4ade80"/>
  <circle cx="36" cy="44" r="2" fill="#facc15"/>
  <!-- Arms -->
  <rect x="4" y="38" width="10" height="4" rx="2" fill="#334155"/>
  <rect x="50" y="38" width="10" height="4" rx="2" fill="#334155"/>
  <!-- Legs -->
  <rect x="20" y="56" width="8" height="8" rx="2" fill="#334155"/>
  <rect x="36" y="56" width="8" height="8" rx="2" fill="#334155"/>
