[project]
name = "dimensional-applications"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mujoco>=3.0.0",
    "open3d>=0.18.0",
    "rerun-sdk>=0.30.0",
    "evo>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.15.0",
    "opencv-python-headless>=4.0.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.0.0",
]

[project.optional-dependencies]
teleop = ["pynput>=1.7.6"]
simworld = ["gymnasium>=1.0.0", "gym"]
