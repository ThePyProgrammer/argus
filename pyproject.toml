[project]
name = "argus"
version = "1.0.0"
description = "Multi-robot, multi-camera perception pipeline manager for MuJoCo environments"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mujoco>=3.0.0",
    "open3d>=0.18.0",
    "rerun-sdk>=0.30.0",
    "evo>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.15.0",
    "opencv-python-headless>=4.0.0",
    "pyzmq>=26.0",
    "msgpack>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "backend"]

[project.scripts]
argus = "src.main:main"

[project.optional-dependencies]
perception = [
    "torch>=2.10.0",
    "transformers>=5.3.0",
    "ultralytics>=8.4.24",
    "scikit-learn>=1.4.0",
    "onnxruntime>=1.19.0",
]
teleop = ["pynput>=1.7.6"]
web = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "websockets>=12.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-asyncio>=0.23.0",
    "optimum[exporters]>=1.20.0",
]

[tool.pytest.ini_options]
markers = [
    "slow_boxer: tests requiring a real BoxeR subprocess (skipped unless explicitly selected; CI runs nightly)",
    "network: tests requiring network access to HuggingFace or GitHub (skipped by default)",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
