[project]
name = "dimensional-applications"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mujoco>=3.0.0",
    "open3d>=0.18.0",
    "rerun-sdk>=0.30.0",
    "evo>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.15.0",
    "opencv-python-headless>=4.0.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.0.0",
    "torch>=2.10.0",
    "transformers>=5.3.0",
    "ultralytics>=8.4.24",
    "einops>=0.8.2",
]

[tool.setuptools.packages.find]
include = ["src*", "backend*"]

[project.scripts]
c2 = "src.main:main"

[project.optional-dependencies]
teleop = ["pynput>=1.7.6"]
simworld = ["gymnasium>=1.0.0", "gym"]
web = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "websockets>=12.0", "trimesh>=4.0.0"]
